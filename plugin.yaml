name: hermes-auto-titler
version: 0.3.0
description: "Topic-aware session title tracking. Hermes owns the first title; the plugin tracks multi-turn evolution, drift, and session close, and never rewrites host configuration on install or uninstall."
author: "Vocllum"
license: Apache-2.0
homepage: https://github.com/Vocllum/hermes-auto-titler
manifest_version: 2
api_version: 1
provides_hooks:
  - pre_llm_call
  - on_session_end
  - on_session_finalize
config_schema:
  enabled:
    type: bool
    default: true
    description: "Register the title hooks and the /autotitler command. Requires a Hermes restart when switched."
  first_title_mode:
    type: str
    default: builtin
    choices: [builtin, plugin]
    description: "builtin leaves the first title to Hermes; plugin evaluates from turn 1. Neither mode changes the host title-generation switch."
  strategy:
    type: str
    default: conservative
    choices: [conservative, aggressive]
    description: "conservative preserves the whole-session subject until a durable mismatch; aggressive follows a sustained new main line sooner."
  title_style:
    type: str
    default: concise
    choices: [concise, complete]
    description: "concise = compact subject label; complete = short summary of the main intent."
  every_n_turns:
    type: int
    default: 2
    description: "Evaluate after this many completed foreground turns; a separate minimum interval can defer evaluations."
  on_close:
    type: bool
    default: true
    description: "Queue a final evaluation on session close or finalize; the write may finish after the session ends."
  rename_confirmations:
    type: int
    default: 1
    description: "Number of follow-up endorsements before replacing an existing automatic title; 0 accepts the first verdict."
  title_model:
    type: str
    default: ""
    description: "Optional title model override. Empty uses Hermes title_generation auxiliary routing."
  provider:
    type: str
    default: ""
    description: "Optional provider override. Empty uses Hermes title_generation auxiliary routing."
  custom_instructions:
    type: str
    default: ""
    description: "Optional instructions appended to the title model system prompt."
  min_interval_minutes:
    type: float
    default: 5
    description: "Minimum minutes between routine evaluations of the same session."
  opening_turns:
    type: int
    default: 2
    description: "Opening user turns shown with real turn positions as initial-purpose evidence."
  recent_turns:
    type: int
    default: 2
    description: "Recent user turns shown with real positions plus the final assistant reply for current-phase evidence."
  summary_preview_chars:
    type: int
    default: 1200
    description: "Compaction-summary budget for fallback or secondary evidence when sparse sampling omits recovered turns."
  preview_chars:
    type: int
    default: 120
    description: "Preview cap per opening/recent message, including assistant conclusions."
  include_all_user_messages:
    type: bool
    default: true
    description: "Include evenly spaced Sampled history between Opening and Recent (legacy key name retained)."
  user_message_threshold:
    type: int
    default: 40
    description: "Target user-turn evidence budget; Opening/Recent anchors are always retained and may exceed very small values; remaining slots go to Sampled history (0 = unlimited middle)."
  user_message_preview_chars:
    type: int
    default: 300
    description: "Per-user-message preview cap in Sampled history; long messages preserve head and tail."
  ignore_model_messages:
    type: bool
    default: false
    description: "Remove assistant conclusions from opening and recent evidence. May lose task outcomes."
  retitle_summary_chars:
    type: int
    default: 12000
    description: "Compaction-summary budget for blind/manual/batch regeneration when used as fallback or secondary sparse-sampling evidence (0 = preview_chars)."
  max_display_width:
    type: int
    default: 40
    description: "Display-width budget when fitting a generated title."
  max_title_length:
    type: int
    default: 0
    description: "Optional hard character cap; 0 disables it, positive values enforce at least 10 characters."
  max_renames_per_session:
    type: int
    default: 0
    description: "Per-process automatic rename cap for a session (0 = unlimited). First naming and manual renames are exempt."
