<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="hermes-auto-titler — session titles that follow the conversation">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdfcfa"/>
      <stop offset="1" stop-color="#f6f4ef"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.16" cy="0.05" r="0.75">
      <stop offset="0" stop-color="#d8b4fe" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#e9d5ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e9d5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.55" cy="1.1" r="0.8">
      <stop offset="0" stop-color="#93c5fd" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#bfdbfe" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#bfdbfe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="1.02" cy="-0.1" r="0.65">
      <stop offset="0" stop-color="#fda4af" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#fecdd3" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fecdd3" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardshadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#3b3554" flood-opacity="0.07"/>
    </filter>
    <filter id="cardshadow2" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="34" flood-color="#3b3554" flood-opacity="0.13"/>
    </filter>
    <filter id="pillshadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#3b3554" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg2)"/>
  <rect width="1200" height="320" fill="url(#glowA)"/>
  <rect width="1200" height="320" fill="url(#glowB)"/>
  <rect width="1200" height="320" fill="url(#glowC)"/>

  <!-- left: wordmark -->
  <g filter="url(#pillshadow)">
    <rect x="64" y="64" width="204" height="30" rx="15" fill="#ffffff" stroke="#e7e2d9"/>
  </g>
  <circle cx="82" cy="79" r="4" fill="#7c5cff"/>
  <text x="94" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#6b6470">HERMES AGENT PLUGIN</text>

  <text x="62" y="148" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, sans-serif" font-size="50" font-weight="700" letter-spacing="-1.5" fill="#1d1d1f">hermes-auto-titler</text>
  <text x="65" y="184" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, sans-serif" font-size="19" font-weight="500" fill="#57534e">Session titles that follow the conversation —</text>
  <text x="65" y="212" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1d1d1f">not the last message.</text>

  <!-- right: sessions card (light, apple-style) -->
  <g filter="url(#cardshadow)">
    <g filter="url(#cardshadow2)">
      <rect x="704" y="44" width="432" height="232" rx="20" fill="#ffffff" stroke="#eceae4"/>
    </g>
  </g>
  <!-- traffic lights -->
  <circle cx="736" cy="74" r="5.5" fill="#ff5f57"/>
  <circle cx="756" cy="74" r="5.5" fill="#febc2e"/>
  <circle cx="776" cy="74" r="5.5" fill="#28c840"/>
  <text x="1104" y="78" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#a8a29e">SESSIONS</text>
  <line x1="726" y1="94" x2="1114" y2="94" stroke="#f0eee8"/>

  <!-- unified left gutter: icon column at x=736, titles at x=762 -->
  <!-- row 1: renamed (gutter icon = purple arrow) -->
  <path d="M736 126 h20 m0 0 l-6 -6 m6 6 l-6 6" stroke="#7c5cff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="766" y="130" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', sans-serif" font-size="14.5" font-weight="600" fill="#1d1d1f">Redis connection leak</text>
  <text x="944" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#b6b0aa">was "new chat 3"</text>
  <rect x="1048" y="113" width="56" height="21" rx="10.5" fill="#7c5cff" fill-opacity="0.12"/>
  <text x="1076" y="127" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1" fill="#7c5cff" font-weight="600">AUTO</text>

  <!-- row separator -->
  <line x1="726" y1="146" x2="1114" y2="146" stroke="#f4f2ec"/>

  <!-- row 2: kept -->
  <text x="766" y="176" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', sans-serif" font-size="14.5" font-weight="500" fill="#44403c">vLLM deploy &amp; tuning</text>
  <rect x="1048" y="159" width="56" height="21" rx="10.5" fill="#10b981" fill-opacity="0.12"/>
  <text x="1076" y="173" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1" fill="#059669" font-weight="600">KEPT</text>

  <!-- row separator -->
  <line x1="726" y1="192" x2="1114" y2="192" stroke="#f4f2ec"/>

  <!-- row 3: user protected (gutter icon = lock) -->
  <rect x="738" y="204" width="10" height="9" rx="2" fill="#f59e0b"/>
  <path d="M740.5 204 v-3.5 a3 3 0 0 1 6 0 v3.5" stroke="#f59e0b" stroke-width="1.8" fill="none"/>
  <text x="766" y="213" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', sans-serif" font-size="14.5" font-weight="500" fill="#44403c">my own title</text>
  <rect x="1048" y="201" width="56" height="21" rx="10.5" fill="#f59e0b" fill-opacity="0.14"/>
  <text x="1076" y="215" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1" fill="#b45309" font-weight="600">USER</text>

  <!-- footer -->
  <line x1="726" y1="234" x2="1114" y2="234" stroke="#f0eee8"/>
  <text x="736" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#78716c">user titles are never overwritten</text>
</svg>
