[project]
name = "hermes-auto-titler"
version = "0.1.3"
description = "Hermes plugin for provenance-aware session title maintenance"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["PyYAML"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hermes_auto_titler"]
