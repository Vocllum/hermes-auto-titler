name: hermes-auto-titler
version: 0.2.3
description: "Topic-aware session title tracking. Default takeover mode disables Hermes built-in title generation by writing auxiliary.title_generation.enabled=false; uninstalling does not restore that setting automatically."
author: "Vocllum"
provides_hooks:
  - pre_llm_call
  - on_session_end
  - on_session_finalize
