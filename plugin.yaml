name: hermes-auto-titler
version: 0.3.0
description: "Topic-aware session title tracking. Hermes owns the first title; the plugin tracks multi-turn evolution, drift, and session close, and never rewrites host configuration on install or uninstall."
author: "Vocllum"
license: Apache-2.0
homepage: https://github.com/Vocllum/hermes-auto-titler
manifest_version: 2
api_version: 1
provides_hooks:
  - pre_llm_call
  - on_session_end
  - on_session_finalize
config_schema:
  enabled:
    type: bool
    label: "Enable AutoTitler"
    default: true
    description: "Track session titles. Restart Hermes after changing this switch."
  first_title_mode:
    type: str
    label: "First title"
    default: builtin
    choices: [builtin, plugin]
    description: "builtin lets Hermes name the first turn; plugin starts evaluating from turn 1. Restart to switch. Neither changes the Hermes title switch."
  strategy:
    type: str
    label: "Tracking strategy"
    default: conservative
    choices: [conservative, aggressive]
    description: "conservative keeps the session's main subject; aggressive follows a sustained new main line sooner."
  title_style:
    type: str
    label: "Title style"
    default: concise
    choices: [concise, complete]
    description: "concise names the subject; complete briefly summarizes the main intent."
  every_n_turns:
    type: int
    label: "Check every N turns"
    default: 2
    description: "Completed turns between checks; the minimum interval can defer them."
  on_close:
    type: bool
    label: "Check on close"
    default: true
    description: "Queue a final check when a session closes; it can finish afterward."
  rename_confirmations:
    type: int
    label: "Rename confirmations"
    default: 1
    description: "Further checks needed before changing an automatic title; 0 changes it immediately."
  title_model:
    type: str
    label: "Title model"
    default: ""
    description: "Optional override; empty uses the Hermes title-generation route."
  provider:
    type: str
    label: "Provider"
    default: ""
    description: "Optional override; empty uses the Hermes title-generation route."
  custom_instructions:
    type: str
    label: "Custom instructions"
    default: ""
    description: "Additional instructions for title generation."
  min_interval_minutes:
    type: float
    label: "Minimum interval (minutes)"
    default: 5
    description: "Minimum time between routine checks of the same session."
  opening_turns:
    type: int
    label: "Opening turns"
    default: 2
    description: "Opening user turns and their final assistant replies used as context."
  recent_turns:
    type: int
    label: "Recent turns"
    default: 2
    description: "Recent user turns and their final assistant replies used as context."
  summary_preview_chars:
    type: int
    label: "Summary context length"
    default: 1200
    description: "Characters of earlier conversation summary used as supporting evidence."
  preview_chars:
    type: int
    label: "Turn preview length"
    default: 120
    description: "Character limit per opening or recent message."
  include_all_user_messages:
    type: bool
    label: "Sample conversation history"
    default: true
    description: "Include evenly spaced user turns between the opening and recent context."
  user_message_threshold:
    type: int
    label: "Sampled turn limit"
    default: 40
    description: "Target history sample size; 0 includes all middle turns. Opening and recent turns are always retained."
  user_message_preview_chars:
    type: int
    label: "History preview length"
    default: 300
    description: "Character limit per sampled user turn, keeping its beginning and end."
  ignore_model_messages:
    type: bool
    label: "Exclude assistant replies"
    default: false
    description: "Use only user messages in opening and recent context; task outcomes may be lost."
  retitle_summary_chars:
    type: int
    label: "Regeneration summary length"
    default: 12000
    description: "Summary character budget for manual or batch regeneration; 0 uses turn preview length."
  max_display_width:
    type: int
    label: "Title display width"
    default: 40
    description: "Maximum display columns for generated titles."
  max_title_length:
    type: int
    label: "Hard title length"
    default: 0
    description: "Optional character cap; 0 disables it. Positive values have a minimum of 10."
  max_renames_per_session:
    type: int
    label: "Renames per session"
    default: 0
    description: "Optional automatic rename limit; 0 disables it. First and manual naming do not count."
