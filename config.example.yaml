# Hermes auto-titler 配置
enabled: true
every_n_turns: 3
on_close: true
recent_turns: 2
opening_turns: 2
ignore_model_messages: false
preview_chars: 200
include_all_user_messages: true
user_message_threshold: 20
user_message_preview_chars: 200
retitle_summary_chars: 1600  # 仅 retitle-all 盲改：压缩摘要截断长度（0=沿用 preview_chars）；盲改无当前标题锚点，需更长摘要恢复 Subject
title_style: concise  # concise = LABEL：主体标签（Subject + 最小区分意图）；complete = SUMMARY：简短事件梗概（Subject + 主要意图/事件）。信息类型是第一约束，长度只是护栏
strategy: conservative
model: ""
min_interval_minutes: 5
max_title_length: 16
max_display_width: 40
